<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>City Run</title>
<style>
  :root{
    --ui:#e9eff6; --dim:#9fb0c2; --accent:#4fc3f7; --gold:#ffd166; --danger:#ff5f6d;
    --panel:rgba(12,18,26,.82); --line:rgba(255,255,255,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;color:var(--ui);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    overscroll-behavior:none;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 12px 12px;
       display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .25s}
  #hud.on{opacity:1}
  #hud-top{display:flex;gap:8px;align-items:flex-start;pointer-events:none}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;
        min-width:64px;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .stat span{display:block;font-size:17px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat small{display:block;font-size:9px;letter-spacing:.09em;color:var(--dim);margin-top:1px}
  .stat.gold span{color:var(--gold)}

  #hud-buttons{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
  .icon-btn{
    width:46px;height:46px;min-width:46px;min-height:46px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);color:var(--ui);
    font-size:15px;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;
  }
  .icon-btn:active{background:rgba(79,195,247,.25)}

  #hud-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
  #missions{display:flex;flex-direction:column;gap:5px;max-width:62%}
  .mission{background:var(--panel);border:1px solid var(--line);border-radius:9px;
           padding:5px 9px;font-size:11px;line-height:1.3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .mission .bar{height:3px;background:rgba(255,255,255,.14);border-radius:2px;margin-top:4px;overflow:hidden}
  .mission .bar i{display:block;height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width .2s}
  .mission.done{border-color:rgba(255,209,102,.7)}
  .mission.done .bar i{background:var(--gold)}

  #btn-slowmo{
    pointer-events:auto;width:82px;height:82px;min-width:82px;min-height:82px;border-radius:50%;
    border:2px solid rgba(79,195,247,.65);background:rgba(12,18,26,.72);color:var(--accent);
    font-size:11px;font-weight:800;letter-spacing:.05em;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;
    transition:transform .1s,opacity .2s;
  }
  #btn-slowmo:active{transform:scale(.94)}
  #btn-slowmo.cool{opacity:.35}

  #fps{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
       font-size:10px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
       border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums;pointer-events:auto;cursor:pointer}
  #fps.hidden{display:none}

  #toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);
         background:rgba(255,209,102,.95);color:#20160a;font-weight:800;font-size:14px;
         padding:9px 18px;border-radius:11px;opacity:0;pointer-events:none;
         transition:opacity .2s,transform .2s;white-space:nowrap}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- Overlays ---------- */
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
           padding:20px;background:rgba(6,10,15,.86);
           backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);z-index:10;overflow-y:auto}
  .overlay.on{display:flex}
  .panel{width:100%;max-width:430px;background:rgba(16,23,32,.94);border:1px solid var(--line);
         border-radius:18px;padding:22px 20px;text-align:center;margin:auto}
  .panel h1{font-size:27px;letter-spacing:.02em;margin-bottom:2px}
  .panel h1 em{font-style:normal;color:var(--accent)}
  .panel .sub{font-size:12px;color:var(--dim);margin-bottom:18px}
  .panel h2{font-size:21px;margin-bottom:10px}
  .btn{display:block;width:100%;min-height:50px;border-radius:13px;border:none;cursor:pointer;
       font-size:16px;font-weight:700;letter-spacing:.02em;margin-top:10px;
       background:linear-gradient(180deg,#57c9f8,#2b9fd4);color:#04121b}
  .btn:active{filter:brightness(.9)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ui)}
  .btn.small{min-height:44px;font-size:14px}

  .keyhint{font-size:11px;color:var(--dim);line-height:1.7;margin-top:14px}
  .keyhint b{color:var(--ui);font-weight:600}

  .scoreline{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;
             border-bottom:1px solid rgba(255,255,255,.07)}
  .scoreline:last-child{border-bottom:none}
  .scoreline .v{font-weight:700;font-variant-numeric:tabular-nums}
  .bigscore{font-size:44px;font-weight:800;color:var(--accent);line-height:1;margin:6px 0 4px;
            font-variant-numeric:tabular-nums}

  .lb{list-style:none;text-align:left;margin:8px 0 4px;max-height:38vh;overflow-y:auto}
  .lb li{display:flex;gap:8px;align-items:center;font-size:13px;padding:7px 8px;border-radius:8px}
  .lb li:nth-child(odd){background:rgba(255,255,255,.045)}
  .lb .rank{width:20px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
  .lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb .sc{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  .lb .dt{font-size:10px;color:var(--dim);width:52px;text-align:right}
  .lb .empty{color:var(--dim);font-size:12px;padding:14px 0;text-align:center}

  input[type=text]{width:100%;min-height:46px;border-radius:11px;border:1px solid var(--line);
    background:rgba(0,0,0,.35);color:var(--ui);padding:0 13px;font-size:15px;font-family:inherit;
    margin-top:10px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}

  @media (max-height:520px){
    .panel{padding:16px;max-width:400px}
    .panel h1{font-size:21px}
    .bigscore{font-size:32px}
    #btn-slowmo{width:66px;height:66px;min-width:66px;min-height:66px;font-size:10px}
    .icon-btn{width:44px;height:44px;min-width:44px;min-height:44px}
    .mission{font-size:10px}
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- ================= HUD ================= -->
<div id="hud">
  <div id="hud-top">
    <div class="stat"><span id="ui-score">0</span><small>SCORE</small></div>
    <div class="stat"><span id="ui-dist">0</span><small>METRES</small></div>
    <div class="stat gold"><span id="ui-coins">0</span><small>COINS</small></div>
    <div id="hud-buttons">
      <button id="btn-mute" class="icon-btn" aria-label="Toggle sound">&#128266;</button>
      <button id="btn-pause" class="icon-btn" aria-label="Pause">&#10073;&#10073;</button>
    </div>
  </div>
  <div id="hud-bottom">
    <div id="missions"></div>
    <button id="btn-slowmo" aria-label="Slow motion">SLOW<br>MO</button>
  </div>
</div>
<div id="fps">-- FPS</div>
<div id="toast"></div>

<!-- ================= MAIN MENU ================= -->
<div id="menu" class="overlay on">
  <div class="panel">
    <h1>CITY <em>RUN</em></h1>
    <div class="sub">Endless 3D runner &middot; procedural city</div>
    <button id="btn-start" class="btn">START RUN</button>
    <button id="btn-leaderboard" class="btn ghost small">LOCAL LEADERBOARD</button>
    <button id="btn-mute2" class="btn ghost small">SOUND: ON</button>
    <div class="keyhint">
      <b>Swipe</b> &#8592; &#8594; change lane &nbsp;&middot;&nbsp; <b>Swipe up</b> jump &nbsp;&middot;&nbsp; <b>Swipe down</b> slide<br>
      <b>Keyboard:</b> A/D or &#8592;/&#8594; lanes, W/&#8593; jump, S/&#8595; slide, Space slow-mo
    </div>
  </div>
</div>

<!-- ================= PAUSE ================= -->
<div id="pause" class="overlay">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="sub">The city waits.</div>
    <button id="btn-resume" class="btn">RESUME</button>
    <button id="btn-quit" class="btn ghost small">QUIT TO MENU</button>
  </div>
</div>

<!-- ================= GAME OVER ================= -->
<div id="gameover" class="overlay">
  <div class="panel">
    <h2>RUN ENDED</h2>
    <div class="bigscore" id="go-score">0</div>
    <div class="sub" id="go-detail">0 m &middot; 0 coins</div>
    <input type="text" id="go-name" maxlength="12" placeholder="Your name" autocomplete="off" />
    <button id="btn-again" class="btn">RUN AGAIN</button>
    <button id="btn-go-menu" class="btn ghost small">MAIN MENU</button>
  </div>
</div>

<!-- ================= LEADERBOARD ================= -->
<div id="lb" class="overlay">
  <div class="panel">
    <h2>LOCAL TOP 10</h2>
    <div class="sub">Stored on this device only</div>
    <ul class="lb" id="lb-list"></ul>
    <button id="btn-lb-close" class="btn ghost">CLOSE</button>
  </div>
</div>

<!-- ================= THREE.JS ================= -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ==========================================================================
   CITY RUN
   Single-file, zero-asset 3D endless runner.
   Every mesh, texture and sound below is generated at runtime.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. TUNABLES
   -------------------------------------------------------------------------- */
const LANE_X        = [-2.6, 0, 2.6];   // three lane centres, metres
const PLAYER_Z      = 0;                // the player never moves in Z; the world does
const SPEED_START   = 14;               // m/s
const SPEED_MAX     = 36;               // m/s soft cap
const SPEED_RAMP    = 950;              // metres of distance for the exponential ramp
const GRAVITY       = 26;               // m/s^2 — game-feel gravity, not 9.81
const JUMP_VELOCITY = 9.2;              // apex ~1.63 m, airtime ~0.71 s
const COYOTE_TIME   = 0.12;             // s of jump forgiveness after leaving ground
const JUMP_BUFFER   = 0.16;             // s a queued jump stays valid while airborne
const SLIDE_TIME    = 0.62;             // s
const SLIDE_COOLDOWN= 0.18;             // s
const SPAWN_AHEAD   = 58;               // metres ahead of the player that objects spawn
const CULL_BEHIND   = 16;               // metres past the camera before recycling
const RAIN_MAX      = 800;              // hard cap — mobile GPUs will choke above this
const DT_CLAMP      = 0.05;             // never simulate more than 50 ms in one step

const PLAYER_HEIGHT       = 1.75;       // standing collision height
const PLAYER_HEIGHT_SLIDE = 0.85;       // sliding collision height
const PLAYER_HALF_X       = 0.32;       // deliberately narrower than the visual model
const PLAYER_HALF_Z       = 0.34;

const LS_KEY = 'cityrun.scores.v1';
const LS_NAME = 'cityrun.name.v1';

/* --------------------------------------------------------------------------
   2. DOM REFERENCES
   -------------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const dom = {
  hud: $('hud'), score: $('ui-score'), dist: $('ui-dist'), coins: $('ui-coins'),
  missions: $('missions'), fps: $('fps'), toast: $('toast'),
  menu: $('menu'), pause: $('pause'), gameover: $('gameover'), lb: $('lb'),
  goScore: $('go-score'), goDetail: $('go-detail'), goName: $('go-name'),
  lbList: $('lb-list'),
  btnStart: $('btn-start'), btnLb: $('btn-leaderboard'), btnMute: $('btn-mute'),
  btnMute2: $('btn-mute2'), btnPause: $('btn-pause'), btnSlow: $('btn-slowmo'),
  btnResume: $('btn-resume'), btnQuit: $('btn-quit'), btnAgain: $('btn-again'),
  btnGoMenu: $('btn-go-menu'), btnLbClose: $('btn-lb-close'),
};

/* --------------------------------------------------------------------------
   3. AUDIO — everything synthesised with the Web Audio API
   -------------------------------------------------------------------------- */
const audio = {
  ctx: null, master: null, muted: false,
  noiseBuffer: null, rainSource: null, rainGain: null, rainFilter: null,
};

function initAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;                                   // gracefully degrade: game is silent
  audio.ctx = new AC();
  audio.master = audio.ctx.createGain();
  audio.master.gain.value = audio.muted ? 0 : 0.55;
  audio.master.connect(audio.ctx.destination);
  buildNoiseBuffer();
  startRainAmbience();                               // gain stays at 0 until it rains
}

function buildNoiseBuffer() {
  const sr = audio.ctx.sampleRate;
  const len = sr * 2;                                // 2 s of white noise, looped
  const buf = audio.ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  audio.noiseBuffer = buf;
}

function noiseSource() {
  const s = audio.ctx.createBufferSource();
  s.buffer = audio.noiseBuffer;
  s.loop = true;
  return s;
}

function sfxCoin() {
  if (!audio.ctx || audio.muted) return;
  const t = audio.ctx.currentTime;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(880, t);
  o.frequency.exponentialRampToValueAtTime(1500, t + 0.07);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g).connect(audio.master);
  o.start(t); o.stop(t + 0.18);
}

function sfxJump() {
  if (!audio.ctx || audio.muted) return;
  const t = audio.ctx.currentTime;
  const s = noiseSource(), f = audio.ctx.createBiquadFilter(), g = audio.ctx.createGain();
  f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(380, t);
  f.frequency.exponentialRampToValueAtTime(1500, t + 0.18);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.20, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  s.connect(f).connect(g).connect(audio.master);
  s.start(t); s.stop(t + 0.26);
}

function sfxSlide() {
  if (!audio.ctx || audio.muted) return;
  const t = audio.ctx.currentTime;
  const s = noiseSource(), f = audio.ctx.createBiquadFilter(), g = audio.ctx.createGain();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(1600, t);
  f.frequency.exponentialRampToValueAtTime(320, t + 0.35);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.17, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  s.connect(f).connect(g).connect(audio.master);
  s.start(t); s.stop(t + 0.42);
}

function sfxCrash() {
  if (!audio.ctx || audio.muted) return;
  const t = audio.ctx.currentTime;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.4);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.45, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g).connect(audio.master);
  o.start(t); o.stop(t + 0.52);

  const s = noiseSource(), f = audio.ctx.createBiquadFilter(), g2 = audio.ctx.createGain();
  f.type = 'lowpass'; f.frequency.value = 900;
  g2.gain.setValueAtTime(0.3, t);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  s.connect(f).connect(g2).connect(audio.master);
  s.start(t); s.stop(t + 0.32);
}

function sfxMission() {
  if (!audio.ctx || audio.muted) return;
  const t0 = audio.ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    const t = t0 + i * 0.075;
    const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(audio.master);
    o.start(t); o.stop(t + 0.2);
  });
}

function sfxFootstep() {
  if (!audio.ctx || audio.muted) return;
  const t = audio.ctx.currentTime;
  const s = noiseSource(), f = audio.ctx.createBiquadFilter(), g = audio.ctx.createGain();
  f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 2.2;
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
  s.connect(f).connect(g).connect(audio.master);
  s.start(t); s.stop(t + 0.06);
}

function startRainAmbience() {
  if (!audio.ctx || audio.rainSource) return;
  const s = noiseSource();
  const f = audio.ctx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 1250; f.Q.value = 0.6;
  const g = audio.ctx.createGain();
  g.gain.value = 0;
  s.connect(f).connect(g).connect(audio.master);
  s.start();
  audio.rainSource = s; audio.rainGain = g; audio.rainFilter = f;
}

function setRainVolume(v) {
  if (!audio.rainGain) return;
  // Never let ambience swamp the SFX; 0.16 is a deliberately quiet bed.
  audio.rainGain.gain.setTargetAtTime(v * 0.16, audio.ctx.currentTime, 0.4);
}

function setMuted(m) {
  audio.muted = m;
  if (audio.master) audio.master.gain.setTargetAtTime(m ? 0 : 0.55, audio.ctx.currentTime, 0.05);
  dom.btnMute.innerHTML = m ? '&#128263;' : '&#128266;';
  dom.btnMute2.textContent = 'SOUND: ' + (m ? 'OFF' : 'ON');
}

/* --------------------------------------------------------------------------
   4. RENDERER / SCENE / CAMERA
   -------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;      // cheap; PCFSoft is too slow on mobile
renderer.domElement.style.touchAction = 'none';
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.3, 150);
camera.position.set(0, 3.3, 7.0);

const FOG_COLOR_CLEAR = new THREE.Color(0xa9b8c6);
const FOG_COLOR_RAIN  = new THREE.Color(0x6a7787);
scene.fog = new THREE.Fog(FOG_COLOR_CLEAR.clone(), 42, 150);
scene.background = FOG_COLOR_CLEAR.clone();

/* --- sky dome (procedural vertical gradient) --- */
function makeSkyTexture() {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#43658c');
  g.addColorStop(0.42, '#8ba4bc');
  g.addColorStop(0.72, '#c0ccd8');
  g.addColorStop(1.00, '#dde2e6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 8, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const skyMat = new THREE.MeshBasicMaterial({
  map: makeSkyTexture(), side: THREE.BackSide, fog: false, depthWrite: false,
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(480, 20, 14), skyMat);
skyDome.renderOrder = -1;
scene.add(skyDome);

/* --- lights --- */
const hemi = new THREE.HemisphereLight(0xdbe7f2, 0x4a4f55, 1.5);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(14, 26, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left   = -16;
sun.shadow.camera.right  =  16;
sun.shadow.camera.top    =  26;
sun.shadow.camera.bottom = -16;
sun.shadow.camera.near   = 1;
sun.shadow.camera.far    = 70;
sun.shadow.bias = -0.0012;
scene.add(sun);
// The player never leaves the origin, so the shadow frustum can stay fixed.
// This is the single biggest shadow-cost saving on mobile.

/* --------------------------------------------------------------------------
   5. PROCEDURAL TEXTURES
   -------------------------------------------------------------------------- */
function canvasTex(w, h, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = 2;                                 // mobile-safe
  return t;
}

function makeRoadTexture() {
  return canvasTex(256, 512, (ctx, W, H) => {
    ctx.fillStyle = '#2a2d31'; ctx.fillRect(0, 0, W, H);
    // asphalt speckle
    for (let i = 0; i < 3500; i++) {
      const v = 32 + Math.random() * 34;
      ctx.fillStyle = `rgb(${v | 0},${v | 0},${(v + 3) | 0})`;
      ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2);
    }
    // dashed lane dividers
    const laneW = W / 3;
    ctx.fillStyle = '#c8c4b4';
    for (let l = 1; l < 3; l++) {
      const x = l * laneW - 3;
      for (let y = 0; y < H; y += 160) ctx.fillRect(x, y, 6, 96);
    }
    // solid edge lines
    ctx.fillStyle = '#d6d2c2';
    ctx.fillRect(4, 0, 5, H);
    ctx.fillRect(W - 9, 0, 5, H);
  }, 1, 26);
}

function makeConcreteTexture() {
  return canvasTex(128, 128, (ctx, W, H) => {
    ctx.fillStyle = '#8d8f8c'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 1400; i++) {
      const v = 110 + Math.random() * 60;
      ctx.fillStyle = `rgba(${v | 0},${v | 0},${(v - 4) | 0},0.5)`;
      ctx.fillRect(Math.random() * W, Math.random() * H, 3, 3);
    }
    ctx.strokeStyle = 'rgba(60,62,60,.45)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }, 4, 40);
}

/**
 * Window facade. `cols`/`rows` control how many windows fit per UV tile;
 * the caller sets repeat so the windows keep a sane physical size.
 */
function makeWindowTexture(baseHex, litChance, cols, rows) {
  return canvasTex(128, 256, (ctx, W, H) => {
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, W, H);
    const cw = W / cols, ch = H / rows;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = x * cw + cw * 0.16, py = y * ch + ch * 0.16;
        const pw = cw * 0.68, ph = ch * 0.68;
        if (Math.random() < litChance) {
          const b = 170 + Math.random() * 70;
          ctx.fillStyle = `rgb(${b | 0},${(b * 0.96) | 0},${(b * 0.84) | 0})`;
        } else {
          const b = 26 + Math.random() * 34;
          ctx.fillStyle = `rgb(${b | 0},${(b + 3) | 0},${(b + 8) | 0})`;
        }
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = 'rgba(0,0,0,.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px, py, pw, ph);
      }
    }
  });
}

/* --------------------------------------------------------------------------
   8. OBJECT POOLS — obstacles, coins
   Pools are pre-allocated and never grow, which guarantees a flat scene
   child count over an arbitrarily long run.
   -------------------------------------------------------------------------- */
function makePool(factory, size) {
  const items = [];
  for (let i = 0; i < size; i++) {
    const it = factory();
    it.active = false;
    it.mesh.visible = false;
    scene.add(it.mesh);
    items.push(it);
  }
  return {
    items,
    acquire() {
      for (let i = 0; i < items.length; i++) {
        if (!items[i].active) return items[i];
      }
      return null;   // pool exhausted — skip the spawn rather than allocate
    },
  };
}

   11. MISSIONS
   -------------------------------------------------------------------------- */
const MISSION_KINDS = ['coins', 'distance', 'nearmiss'];

function makeMission(kind, difficulty) {
  const t = Math.round(difficulty);
  switch (kind) {
    case 'coins':    return { kind, label: `Collect ${t} coins`,        target: t, progress: 0, reward: 60 + t * 4 };
    case 'distance': return { kind, label: `Run ${t * 10} metres`,      target: t * 10, progress: 0, reward: 80 + t * 3 };
    default:         return { kind, label: `Near-miss ${t} vehicles`,   target: t, progress: 0, reward: 100 + t * 12 };
  }
}

function rollMissionKinds() {
  // Three concurrent missions, never two of the same kind.
  const pool = MISSION_KINDS.slice();
  const picked = [];
  for (let i = 0; i < 3; i++) {
    const idx = (Math.random() * pool.length) | 0;
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked;
}

function resetMissions() {
  const kinds = rollMissionKinds();
  state.missions = kinds.map((k, i) => makeMission(k, [10, 14, 6][i] + Math.random() * 4));
  state.missionDirty = true;
  renderMissions();
}

function progressMissions(kind, amount) {
  let changed = false;
  for (const m of state.missions) {
    if (m.kind !== kind || m.progress >= m.target) continue;
    m.progress = Math.min(m.target, m.progress + amount);
    changed = true;
    if (m.progress >= m.target) completeMission(m);
  }
  if (changed) state.missionDirty = true;
}

function completeMission(m) {
  state.coins += m.reward;
  state.score += m.reward;
  sfxMission();
  showToast(`${m.label} — +${m.reward} coins`);
  // Rotate in a fresh mission of a different kind.
  const others = MISSION_KINDS.filter((k) => k !== m.kind);
  const nextKind = others[(Math.random() * others.length) | 0];
  const idx = state.missions.indexOf(m);
  state.missions[idx] = makeMission(nextKind, 8 + Math.random() * 14);
}

function renderMissions() {
  let html = '';
  for (const m of state.missions) {
    const pct = Math.min(100, (m.progress / m.target) * 100);
    const done = m.progress >= m.target;
    html += `<div class="mission${done ? ' done' : ''}">${m.label}
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></div>`;
  }
  dom.missions.innerHTML = html;
}

   12. LOCAL LEADERBOARD (localStorage, top 10, per device)
   -------------------------------------------------------------------------- */
function loadScores() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];   // private browsing / storage disabled — fail silently
  }
}

function saveScoreEntry(name, score, distance, coins) {
  const entry = { name: name || 'Runner', score, distance, coins, date: Date.now() };
  try {
    const list = loadScores();
    list.push(entry);
    list.sort((a, b) => b.score - a.score);
    localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 10)));
  } catch (e) { /* persistence unavailable — the run still counts in-session */ }
  return entry;
}

function renderLeaderboard() {
  const list = loadScores();
  if (!list.length) {
    dom.lbList.innerHTML = '<li class="empty">No runs yet. Go make one.</li>';
    return;
  }
  dom.lbList.innerHTML = list.map((e, i) => {
    const d = new Date(e.date);
    const stamp = `${d.getMonth() + 1}/${d.getDate()}`;
    return `<li><span class="rank">${i + 1}</span>
      <span class="nm">${escapeHtml(e.name)}</span>
      <span class="sc">${e.score}</span>
      <span class="dt">${stamp}</span></li>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function loadName() {
  try { return localStorage.getItem(LS_NAME) || ''; } catch (e) { return ''; }
}
function storeName(n) {
  try { localStorage.setItem(LS_NAME, n); } catch (e) { /* ignore */ }
}

/* --------------------------------------------------------------------------
   13. ADAPTIVE QUALITY GOVERNOR
   Degrades rain count, then shadow map size, then draw distance,
   in that order, when frame time stays above 21 ms.
   -------------------------------------------------------------------------- */
const QUALITY_TIERS = [
  { rain: RAIN_MAX, shadow: 1024, far: 150, fogFar: 150, pixelRatio: Math.min(window.devicePixelRatio || 1, 2) },
  { rain: 400,      shadow: 512,  far: 110, fogFar: 115, pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5) },
  { rain: 180,      shadow: 256,  far: 85,  fogFar: 90,  pixelRatio: 1 },
];

const perf = { tier: 0, slowAccum: 0, cooldown: 0, frames: 0, accum: 0, fps: 0, showFps: true };

function applyQualityTier(tier) {
  perf.tier = tier;
  const q = QUALITY_TIERS[tier];
  console.log(`[CityRun] quality tier -> ${tier} (rain ${q.rain}, shadow ${q.shadow}, far ${q.far})`);

  // Rain
  rainGeo.setDrawRange(0, q.rain);

  // Shadow map — must dispose before resizing or the old buffer leaks.
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  sun.shadow.mapSize.set(q.shadow, q.shadow);

  // Draw distance
  camera.far = q.far;
  camera.updateProjectionMatrix();
  scene.fog.far = q.fogFar;

  // Pixel ratio
  renderer.setPixelRatio(q.pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function updatePerformance(frameMs) {
  // FPS readout, refreshed twice a second.
  perf.accum += frameMs / 1000;
  perf.frames++;
  if (perf.accum >= 0.5) {
    perf.fps = perf.frames / perf.accum;
    perf.accum = 0; perf.frames = 0;
    if (perf.showFps) dom.fps.textContent = perf.fps.toFixed(0) + ' FPS';
  }

  // Sustained-slow detection: integrate above-threshold time, decay below it.
  if (frameMs > 21) perf.slowAccum += frameMs / 1000;
  else perf.slowAccum = Math.max(0, perf.slowAccum - (frameMs / 1000) * 2);

  perf.cooldown -= frameMs / 1000;
  if (perf.slowAccum > 2 && perf.cooldown <= 0 && perf.tier < QUALITY_TIERS.length - 1) {
    applyQualityTier(perf.tier + 1);
    perf.slowAccum = 0;
    perf.cooldown = 6;   // don't oscillate between tiers
  }
}

/* --------------------------------------------------------------------------
   14. INPUT — touch swipes + keyboard
   -------------------------------------------------------------------------- */
const SWIPE_MIN_DISTANCE = 30;   // CSS px — below this, it's a tap
const SWIPE_MAX_TIME = 600;      // ms — slower than this is not a swipe
const SWIPE_ANGLE_BIAS = 1.35;   // dominant axis must exceed the other by this factor

let touchStart = null;

function onTouchStart(e) {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY, time: performance.now() };
}

function onTouchEnd(e) {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  if (!t) { touchStart = null; return; }
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const dt = performance.now() - touchStart.time;
  touchStart = null;

  if (dt > SWIPE_MAX_TIME) return;                       // too slow to be a swipe
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < SWIPE_MIN_DISTANCE) return;   // too short

  // Diagonal bias: only fire one action even on a sloppy diagonal swipe.
  if (adx > ady * SWIPE_ANGLE_BIAS) {
    moveLane(dx > 0 ? 1 : -1);
  } else if (ady > adx * SWIPE_ANGLE_BIAS) {
    if (dy < 0) requestJump(); else requestSlide();
  }
}

function onTouchMove(e) {
  // Prevent the page from scrolling / pull-to-refresh during a swipe.
  if (e.cancelable) e.preventDefault();
}

function bindInput() {
  const el = renderer.domElement;
  el.addEventListener('touchstart', onTouchStart, { passive: true });
  el.addEventListener('touchmove', onTouchMove, { passive: false });
  el.addEventListener('touchend', onTouchEnd, { passive: true });
  el.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });

  window.addEventListener('keydown', (e) => {
    if (state.mode !== 'playing') {
      if (e.code === 'Space' && state.mode === 'menu') { e.preventDefault(); startRun(); }
      return;
    }
    switch (e.code) {
      case 'ArrowLeft':  case 'KeyA': moveLane(-1); break;
      case 'ArrowRight': case 'KeyD': moveLane(1);  break;
      case 'ArrowUp':    case 'KeyW': requestJump();  e.preventDefault(); break;
      case 'ArrowDown':  case 'KeyS': requestSlide(); e.preventDefault(); break;
      case 'Space':      activateSlowMo(); e.preventDefault(); break;
      case 'Escape': case 'KeyP': pauseGame(); break;
      default: break;
    }
  });
}

/* --------------------------------------------------------------------------
   15. PLAYER ACTIONS
   -------------------------------------------------------------------------- */
function moveLane(dir) {
  if (state.mode !== 'playing') return;
  const next = THREE.MathUtils.clamp(state.lane + dir, 0, 2);
  if (next === state.lane) return;
  state.lane = next;
  state.laneTargetX = LANE_X[next];
}

function requestJump() {
  if (state.mode !== 'playing') return;
  if (state.grounded || state.coyote > 0) {
    doJump();
  } else {
    state.jumpBuffer = JUMP_BUFFER;   // queue it; it fires the instant we land
  }
}

function doJump() {
  state.vy = JUMP_VELOCITY;
  state.grounded = false;
  state.coyote = 0;
  state.jumpBuffer = 0;
  state.sliding = false;
  state.slideTimer = 0;
  sfxJump();
}

function requestSlide() {
  if (state.mode !== 'playing') return;
  if (state.slideCooldown > 0 || state.sliding) return;
  if (!state.grounded) {
    // Air-slide: slam down fast, then slide. Common, forgiving runner behaviour.
    state.vy = Math.min(state.vy, -14);
  }
  state.sliding = true;
  state.slideTimer = SLIDE_TIME;
  state.slideCooldown = SLIDE_TIME + SLIDE_COOLDOWN;
  sfxSlide();
}

function activateSlowMo() {
  if (state.mode !== 'playing' || state.slowMoActive) return;
  state.slowMoActive = true;
  state.slowMoTimer = 2.0;      // real seconds, so the effect is predictable
  state.timeScale = 0.35;
}

/* --------------------------------------------------------------------------
   16. SPAWNING
   -------------------------------------------------------------------------- */
function laneHasObstacleNear(lane, z, tolerance = 12) {
  for (const pool of OBSTACLE_POOLS) {
    for (const o of pool.items) {
      if (!o.active || o.lane !== lane) continue;
      if (Math.abs(o.mesh.position.z - z) < tolerance) return true;
    }
  }
  return false;
}

function spawnRow() {
  const spawnZ = -Math.max(SPAWN_AHEAD, state.speed * 1.9);

  // Only consider lanes that are free of a too-close neighbour.
  const candidates = [0, 1, 2].filter((l) => !laneHasObstacleNear(l, spawnZ));
  if (candidates.length < 2) return;   // not enough room for a fair row — skip

  // Shuffle
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  // Never block all three lanes: at least one is always open.
  const maxBlock = Math.min(2, candidates.length - 1);
  const blockCount = Math.random() < 0.55 ? 1 : maxBlock;
  const blockedLanes = candidates.slice(0, blockCount);

  for (const lane of blockedLanes) {
    const roll = Math.random();
    let pool, type;
    if (roll < 0.35)      { pool = pools.low;  type = 'low'; }
    else if (roll < 0.60) { pool = pools.high; type = 'high'; }
    else                  { pool = pools.car;  type = 'car'; }

    const obj = pool.acquire();
    if (!obj) continue;                 // pool exhausted, skip cleanly

    obj.active = true;
    obj.lane = lane;
    obj.mesh.visible = true;
    obj.mesh.position.set(LANE_X[lane], 0, spawnZ);

    if (type === 'car') {
      obj.counted = false;
      // 25% oncoming traffic, otherwise a slower same-direction car.
      obj.relSpeed = Math.random() < 0.25 ? 1.45 : 0.58 + Math.random() * 0.22;
      obj.mesh.rotation.y = obj.relSpeed > 1 ? Math.PI : 0;
    }
  }

  // Coins in one of the lanes that stayed open.
  const openLanes = [0, 1, 2].filter((l) => !blockedLanes.includes(l));
  if (openLanes.length && Math.random() < 0.68) {
    const lane = openLanes[(Math.random() * openLanes.length) | 0];
    spawnCoinRun(lane, spawnZ - Math.random() * 8);
  }
}

function spawnCoinRun(lane, zStart) {
  const count = 4 + ((Math.random() * 3) | 0);
  const arc = Math.random() < 0.45;
  for (let i = 0; i < count; i++) {
    const coin = pools.coin.acquire();
    if (!coin) return;
    coin.active = true;
    coin.lane = lane;
    coin.mesh.visible = true;
    const t = count > 1 ? i / (count - 1) : 0;
    const y = arc ? 0.85 + Math.sin(t * Math.PI) * 1.35 : 1.0;
    coin.mesh.position.set(LANE_X[lane], y, zStart - i * 2.4);
    coin.mesh.rotation.set(0, 0, 0);
  }
}

/* --------------------------------------------------------------------------
   17. COLLISION — pure AABB, no raycasting
   -------------------------------------------------------------------------- */
function playerAABB() {
  const h = state.sliding ? PLAYER_HEIGHT_SLIDE : PLAYER_HEIGHT;
  return {
    x: player.position.x, z: PLAYER_Z,
    halfX: PLAYER_HALF_X, halfZ: PLAYER_HALF_Z,
    yMin: player.position.y, yMax: player.position.y + h,
  };
}

function aabbOverlap(a, b) {
  return Math.abs(a.x - b.x) < a.halfX + b.halfX
      && Math.abs(a.z - b.z) < a.halfZ + b.halfZ
      && a.yMin < b.yMax
      && a.yMax > b.yMin;
}

function checkObstacleCollisions() {
  const p = playerAABB();
  for (const pool of OBSTACLE_POOLS) {
    for (const o of pool.items) {
      if (!o.active) continue;
      const box = {
        x: o.mesh.position.x, z: o.mesh.position.z,
        halfX: o.halfX, halfZ: o.halfZ, yMin: o.yMin, yMax: o.yMax,
      };
      if (aabbOverlap(p, box)) { endRun(); return true; }
    }
  }
  return false;
}

/* --------------------------------------------------------------------------
   18. UPDATE FUNCTIONS
   -------------------------------------------------------------------------- */
function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}

function updateSpeedAndDistance(dt) {
  // Exponential approach to SPEED_MAX — smooth, no hard steps, soft cap.
  const target = SPEED_MAX - (SPEED_MAX - SPEED_START) * Math.exp(-state.distance / SPEED_RAMP);
  state.speed = target;
  state.distance += state.speed * dt;
}

function updateScroll(dt, speed) {
  const dz = speed * dt;

  // Road texture scroll — cheap illusion of forward motion on a static plane.
  roadTex.offset.y -= dz / 17;

  // Buildings, streetlights and anything else on a fixed loop.
  for (const s of scrollers) {
    s.obj.position.z += dz;
    if (s.obj.position.z > 26) {
      s.obj.position.z -= s.span;
      // Re-randomise the building footprint on recycle so the loop is not obvious.
      if (s.span === BUILDING_LOOP) {
        s.obj.position.x = s.side * (11 + Math.random() * 9);
      }
    }
  }
}

function updatePlayer(dt) {
  // Lateral lane lerp
  player.position.x = damp(player.position.x, state.laneTargetX, 15, dt);

  // Vertical physics
  if (!state.grounded) {
    state.vy -= GRAVITY * dt;
    player.position.y += state.vy * dt;
    if (player.position.y <= 0) {
      player.position.y = 0;
      state.vy = 0;
      state.grounded = true;
      state.coyote = COYOTE_TIME;
    }
  } else {
    state.coyote = Math.max(0, state.coyote - dt);
  }

  // Buffered jump fires the moment we touch down.
  if (state.jumpBuffer > 0) {
    state.jumpBuffer -= dt;
    if (state.grounded) doJump();
  }

  // Slide timer + cooldown
  if (state.sliding) {
    state.slideTimer -= dt;
    if (state.slideTimer <= 0) state.sliding = false;
  }
  if (state.slideCooldown > 0) state.slideCooldown -= dt;

  // Run cycle phase scales with speed so the stride matches the ground.
  state.runPhase += (state.speed / 6.5) * dt;

  poseRunner(dt);
}

function poseRunner(dt) {
  const phase = state.runPhase;
  const speedNorm = THREE.MathUtils.clamp(
    (state.speed - SPEED_START) / (SPEED_MAX - SPEED_START), 0, 1
  );
  const swing = 0.85 + speedNorm * 0.5;

  let tLegL = 0, tLegR = 0, tArmL = 0, tArmR = 0, tKneeL = 0, tKneeR = 0;
  let tElbowL = -0.3, tElbowR = -0.3;
  let tTilt = 0, tScaleY = 1, tRootY = 0;

  if (state.sliding) {
    // Compressed crouch that reads unmistakably as a slide.
    tTilt = -0.45; tScaleY = 0.56; tRootY = 0;
    tLegL = 1.15; tLegR = 1.35;
    tKneeL = -0.2; tKneeR = -0.2;
    tArmL = -1.5; tArmR = -1.5;
  } else if (!state.grounded) {
    // Tuck: knees up, arms forward.
    tLegL = -0.95; tLegR = -0.35;
    tKneeL = 1.25; tKneeR = 0.75;
    tArmL = -1.45; tArmR = -1.3;
    tTilt = 0.1;
  } else {
    // Run cycle
    tLegL = Math.sin(phase) * swing;
    tLegR = Math.sin(phase + Math.PI) * swing;
    tKneeL = Math.max(0, Math.sin(phase)) * 1.15;
    tKneeR = Math.max(0, Math.sin(phase + Math.PI)) * 1.15;
    tArmL = Math.sin(phase + Math.PI) * swing * 0.85;
    tArmR = Math.sin(phase) * swing * 0.85;
    tRootY = Math.abs(Math.sin(phase)) * 0.045;
    tTilt = 0.08 + speedNorm * 0.06;
  }

  const k = 18;   // pose damping rate
  rig.legL.rotation.x  = damp(rig.legL.rotation.x,  tLegL, k, dt);
  rig.legR.rotation.x  = damp(rig.legR.rotation.x,  tLegR, k, dt);
  rig.shinL.rotation.x = damp(rig.shinL.rotation.x, -tKneeL, k, dt);
  rig.shinR.rotation.x = damp(rig.shinR.rotation.x, -tKneeR, k, dt);
  rig.armL.rotation.x  = damp(rig.armL.rotation.x,  tArmL, k, dt);
  rig.armR.rotation.x  = damp(rig.armR.rotation.x,  tArmR, k, dt);
  rig.foreL.rotation.x = damp(rig.foreL.rotation.x, tElbowL, k, dt);
  rig.foreR.rotation.x = damp(rig.foreR.rotation.x, tElbowR, k, dt);

  rigRoot.rotation.x = damp(rigRoot.rotation.x, tTilt, 12, dt);
  rigRoot.scale.y    = damp(rigRoot.scale.y, tScaleY, 16, dt);
  rigRoot.position.y = damp(rigRoot.position.y, tRootY, 16, dt);

  // Footstep ticks, one per half stride.
  if (state.grounded && !state.sliding) {
    const prev = state.footstepAccum;
    state.footstepAccum = phase % Math.PI;
    if (state.footstepAccum < prev) sfxFootstep();
  }
}

function updateObstacles(dt) {
  for (const pool of OBSTACLE_POOLS) {
    for (const o of pool.items) {
      if (!o.active) continue;
      const rel = o.type === 'car' ? o.relSpeed : 1;
      o.mesh.position.z += state.speed * rel * dt;

      // Near-miss bookkeeping: fires once, as the object passes the player.
      if (o.type === 'car' && !o.counted && o.mesh.position.z > PLAYER_Z) {
        o.counted = true;
        const dx = Math.abs(o.mesh.position.x - player.position.x);
        if (dx > 0.8 && dx < 3.4) {
          state.nearMisses++;
          progressMissions('nearmiss', 1);
        }
      }

      if (o.mesh.position.z > CULL_BEHIND) {
        o.active = false;
        o.mesh.visible = false;
      }
    }
  }
}

function updateCoins(dt) {
  const px = player.position.x;
  const py = player.position.y + 0.9;   // chest height collection point

  for (const c of pools.coin.items) {
    if (!c.active) continue;
    c.mesh.position.z += state.speed * dt;
    c.mesh.rotation.y += 4.5 * dt;
    c.mesh.rotation.z = Math.sin(performance.now() * 0.002 + c.mesh.position.z) * 0.2;

    if (c.mesh.position.z > CULL_BEHIND) {
      c.active = false;
      c.mesh.visible = false;
      continue;
    }

    // Collect radius — generous, and cheap (no raycasting).
    const dx = c.mesh.position.x - px;
    const dy = c.mesh.position.y - py;
    const dz = c.mesh.position.z - PLAYER_Z;
    if (dx * dx + dy * dy + dz * dz < 1.1 * 1.1) {
      c.active = false;
      c.mesh.visible = false;
      state.coins++;
      state.score += 10 * state.multiplier;
      progressMissions('coins', 1);
      sfxCoin();
    }
  }
}

function updateSpawner(dt) {
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnRow();
    // Reaction window shrinks with speed but never below 0.72 s between rows.
    const interval = THREE.MathUtils.clamp(1.15 - (state.speed - SPEED_START) * 0.014, 0.72, 1.15);
    state.spawnTimer = interval;
  }
}

function updateCamera(dt) {
  const targetX = player.position.x * 0.55;
  const targetY = 3.25 + player.position.y * 0.28;
  camera.position.x = damp(camera.position.x, targetX, 7, dt);
  camera.position.y = damp(camera.position.y, targetY, 7, dt);
  camera.position.z = damp(camera.position.z, 7.0, 7, dt);
  camera.lookAt(player.position.x * 0.42, 1.25 + player.position.y * 0.35, -6.5);

  // Subtle FOV kick with speed — the classic "sense of velocity" trick.
  const speedNorm = THREE.MathUtils.clamp(
    (state.speed - SPEED_START) / (SPEED_MAX - SPEED_START), 0, 1
  );
  const targetFov = 62 + speedNorm * 8;
  camera.fov = damp(camera.fov, targetFov, 3, dt);
  camera.updateProjectionMatrix();
}

function updateWeather(dt) {
  state.weatherTimer -= dt;
  if (state.weatherTimer <= 0) {
    state.rainTarget = state.rainTarget > 0.5 ? 0 : 1;
    state.weatherTimer = 28 + Math.random() * 22;
  }
  state.rain = damp(state.rain, state.rainTarget, 0.6, dt);

  const rainOn = state.rain > 0.03;
  rainPoints.visible = rainOn;
  rainMat.opacity = state.rain * 0.8;
  setRainVolume(state.rain);

  // Darken the sky and the fog as rain comes in.
  scene.fog.color.copy(FOG_COLOR_CLEAR).lerp(FOG_COLOR_RAIN, state.rain);
  scene.background.copy(scene.fog.color);
  skyMat.color.setRGB(
    1 - state.rain * 0.42,
    1 - state.rain * 0.38,
    1 - state.rain * 0.30
  );
  hemi.intensity = 1.5 - state.rain * 0.55;
  sun.intensity = 2.2 - state.rain * 1.2;

  // Wet-road sheen: lower roughness, add a little metalness. No post-processing.
  roadMat.roughness = 0.92 - state.rain * 0.55;
  roadMat.metalness = state.rain * 0.22;
}

function updateRain(dt) {
  if (!rainPoints.visible) return;
  const count = rainGeo.drawRange.count;
  const drift = state.speed * 0.30 * dt;
  const pos = rainGeo.attributes.position.array;

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    pos[i3 + 1] -= rainVelocity[i] * dt;
    pos[i3 + 2] += drift;

    if (pos[i3 + 1] < 0 || pos[i3 + 2] > 16) {
      pos[i3 + 0] = (Math.random() - 0.5) * 60;
      pos[i3 + 1] = 20 + Math.random() * 10;
      pos[i3 + 2] = -34 + Math.random() * 30;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;
}

function updateSlowMo(realDt) {
  if (!state.slowMoActive) return;
  state.slowMoTimer -= realDt;     // real time, so the effect is a predictable 2 s
  if (state.slowMoTimer <= 0) {
    state.slowMoActive = false;
    state.timeScale = 1;
  }
  dom.btnSlow.classList.toggle('cool', true);
}

/* --------------------------------------------------------------------------
   19. UI PLUMBING
   -------------------------------------------------------------------------- */
let uiAccum = 0;

function updateHUD(dt) {
  uiAccum += dt;
  if (uiAccum < 0.08) return;      // ~12 Hz is plenty and avoids layout thrash
  uiAccum = 0;

  dom.score.textContent = Math.floor(state.score);
  dom.dist.textContent = Math.floor(state.distance);
  dom.coins.textContent = state.coins;

  if (state.missionDirty) { renderMissions(); state.missionDirty = false; }

  const cool = state.slowMoActive || state.slideCooldown > 0;
  dom.btnSlow.classList.toggle('cool', state.slowMoActive);
}

let toastTimer = 0;
function showToast(msg) {
  dom.toast.textContent = msg;
  dom.toast.classList.add('on');
  toastTimer = 2.0;
}
function updateToast(dt) {
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) dom.toast.classList.remove('on');
  }
}

/* --------------------------------------------------------------------------
   20. GAME FLOW
   -------------------------------------------------------------------------- */
function resetWorld() {
  for (const pool of [...OBSTACLE_POOLS, pools.coin]) {
    for (const o of pool.items) { o.active = false; o.mesh.visible = false; }
  }
}

function startRun() {
  initAudio();
  resetWorld();
  resetMissions();

  state.mode = 'playing';
  state.speed = SPEED_START;
  state.distance = 0;
  state.score = 0;
  state.coins = 0;
  state.lane = 1;
  state.laneTargetX = LANE_X[1];
  state.vy = 0;
  state.grounded = true;
  state.coyote = 0;
  state.jumpBuffer = 0;
  state.sliding = false;
  state.slideTimer = 0;
  state.slideCooldown = 0;
  state.runPhase = 0;
  state.timeScale = 1;
  state.slowMoActive = false;
  state.slowMoTimer = 0;
  state.multiplier = 1;
  state.nearMisses = 0;
  state.spawnTimer = 1.1;
  state.coinTimer = 2.4;
  state.footstepAccum = 0;

  player.position.set(LANE_X[1], 0, PLAYER_Z);
  rigRoot.rotation.set(0, 0, 0);
  rigRoot.scale.set(1, 1, 1);
  rigRoot.position.set(0, 0, 0);

  dom.menu.classList.remove('on');
  dom.gameover.classList.remove('on');
  dom.pause.classList.remove('on');
  dom.hud.classList.add('on');
  dom.btnSlow.classList.remove('cool');

  renderMissions();
}

function pauseGame() {
  if (state.mode !== 'playing') return;
  state.mode = 'paused';
  dom.pause.classList.add('on');
}

function resumeGame() {
  if (state.mode !== 'paused') return;
  state.mode = 'playing';
  dom.pause.classList.remove('on');
}

function endRun() {
  if (state.mode !== 'playing') return;
  state.mode = 'gameover';
  state.timeScale = 1;
  state.slowMoActive = false;
  sfxCrash();

  dom.goScore.textContent = Math.floor(state.score);
  dom.goDetail.textContent = `${Math.floor(state.distance)} m · ${state.coins} coins · ${state.nearMisses} near-misses`;
  dom.goName.value = loadName();
  dom.gameover.classList.add('on');
  dom.hud.classList.remove('on');
}

function quitToMenu() {
  state.mode = 'menu';
  resetWorld();
  dom.pause.classList.remove('on');
  dom.gameover.classList.remove('on');
  dom.hud.classList.remove('on');
  dom.menu.classList.add('on');
}

/* --------------------------------------------------------------------------
   21. MAIN LOOP
   -------------------------------------------------------------------------- */
let lastFrameTime = performance.now();

function frame(now) {
  requestAnimationFrame(frame);

  const frameMs = now - lastFrameTime;
  lastFrameTime = now;

  // Clamp the simulation step so a stalled tab can't teleport the player.
  const rawDt = Math.min(frameMs / 1000, DT_CLAMP);

  updatePerformance(frameMs);

  if (state.mode === 'playing') {
    updateSlowMo(rawDt);
    const dt = rawDt * state.timeScale;

    updateSpeedAndDistance(dt);
    updateScroll(dt, state.speed);
    updatePlayer(dt);
    updateSpawner(dt);
    updateObstacles(dt);
    updateCoins(dt);
    updateCamera(dt);

    state.score += state.speed * dt * state.multiplier;

    progressMissions('distance', state.speed * dt);

    if (!checkObstacleCollisions()) {
      updateHUD(rawDt);
    }
  } else if (state.mode === 'menu') {
    // Idle attract mode: the world keeps scrolling, the runner keeps running.
    state.speed = 9;
    updateScroll(rawDt, 9);
    updatePlayer(rawDt);
    updateCamera(rawDt);
  } else if (state.mode === 'gameover') {
    // Freeze the world but keep the camera alive so nothing snaps.
    updateCamera(rawDt);
  }

  updateWeather(rawDt);
  updateRain(rawDt);
  updateToast(rawDt);

  renderer.render(scene, camera);
}

/* --------------------------------------------------------------------------
   22. RESIZE / VISIBILITY / CONTEXT LOSS
   -------------------------------------------------------------------------- */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state.mode === 'playing') pauseGame();
    if (audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend();
  } else {
    // Reset the frame clock so the first frame back isn't a 30-second delta.
    lastFrameTime = performance.now();
    if (audio.ctx && audio.ctx.state === 'suspended' && state.mode === 'playing') {
      audio.ctx.resume();
    }
  }
});
window.addEventListener('pagehide', () => { if (state.mode === 'playing') pauseGame(); });

renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  if (state.mode === 'playing') pauseGame();
  console.warn('[CityRun] WebGL context lost — paused.');
}, false);

renderer.domElement.addEventListener('webglcontextrestored', () => {
  console.log('[CityRun] WebGL context restored.');
  applyQualityTier(perf.tier);   // re-upload the shadow map at the right size
}, false);

/* --------------------------------------------------------------------------
   23. UI EVENT WIRING
   -------------------------------------------------------------------------- */
function bindUI() {
  dom.btnStart.addEventListener('click', startRun);
  dom.btnResume.addEventListener('click', resumeGame);
  dom.btnQuit.addEventListener('click', quitToMenu);
  dom.btnGoMenu.addEventListener('click', quitToMenu);
  dom.btnPause.addEventListener('click', pauseGame);

  dom.btnAgain.addEventListener('click', () => {
    const name = (dom.goName.value || 'Runner').trim().slice(0, 12) || 'Runner';
    storeName(name);
    saveScoreEntry(name, Math.floor(state.score), Math.floor(state.distance), state.coins);
    startRun();
  });

  dom.btnLb.addEventListener('click', () => {
    renderLeaderboard();
    dom.lb.classList.add('on');
  });
  dom.btnLbClose.addEventListener('click', () => dom.lb.classList.remove('on'));

  const toggleMute = () => { initAudio(); setMuted(!audio.muted); };
  dom.btnMute.addEventListener('click', toggleMute);
  dom.btnMute2.addEventListener('click', toggleMute);

  dom.btnSlow.addEventListener('click', activateSlowMo);

  dom.fps.addEventListener('click', () => {
    perf.showFps = !perf.showFps;
    dom.fps.classList.toggle('hidden', !perf.showFps);
  });

  // Buttons must not double-fire as swipes.
  for (const el of [dom.btnSlow, dom.btnPause, dom.btnMute, dom.fps]) {
    el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
  }
}

/* --------------------------------------------------------------------------
   24. BOOT
   -------------------------------------------------------------------------- */
function boot() {
  applyQualityTier(0);
  bindInput();
  bindUI();

  const savedName = loadName();
  dom.goName.value = savedName;

  resetMissions();
  renderLeaderboard();
  dom.hud.classList.remove('on');
  dom.menu.classList.add('on');

  lastFrameTime = performance.now();
  requestAnimationFrame(frame);
}

boot();
</script>
